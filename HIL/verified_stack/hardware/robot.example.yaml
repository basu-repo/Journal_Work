# Copy this file and replace every value with the receiving robot's measured
# configuration. The planner has no dependency on a particular terrain.
base_frame: base_link
map_frame: map
odom_frame: odom_lidar
odom_topic: /fastlio/odometry_base
localization_mode: slam
use_sim_time: false

# Supplied localization launcher reads this section. Set calibration_confirmed
# only after measuring these values and verifying frames on the receiving robot.
localization:
  calibration_confirmed: false
  fastlio_config: fastlio.site.yaml
  pointcloud_topic: /lidar/points
  imu_topic: /imu/data
  raw_odom_topic: /fastlio/odometry
  source_frame: camera_init
  source_body_frame: body
  # Pose of base_link expressed in FAST-LIO's IMU/body frame (x,y,z and x,y,z,w).
  body_to_base_translation: [0.0, 0.0, 0.0]
  body_to_base_quaternion: [0.0, 0.0, 0.0, 1.0]
  min_height: 0.15
  max_height: 2.0
  range_min: 0.8
  range_max: 60.0
  scan_angle_increment: 0.006135923151542565
  scan_period: 0.1
  sensor_timeout: 1.0
  map_timeout: 10.0
  tf_timeout: 0.5
  stable_seconds: 2.0

# Rectangle shown only as an example: [front/back, left/right] metres from base_link.
footprint:
  - [-0.50, -0.35]
  - [0.50, -0.35]
  - [0.50, 0.35]
  - [-0.50, 0.35]
footprint_padding: 0.05

# Begin below the verified physical limits and raise them only after testing.
max_linear_speed: 0.30
max_angular_speed: 0.30
linear_acceleration: 0.25
angular_acceleration: 0.40
reverse_speed: 0.10
command_timeout: 0.60

# Existing robot/terrain stack topics used by this package.
scan_topic: /scan
map_topic: /map

# Planner output stays isolated until the watchdog approves it.
planner_command_topic: /hil/planner_cmd_vel
hardware_command_topic: /cmd_vel
