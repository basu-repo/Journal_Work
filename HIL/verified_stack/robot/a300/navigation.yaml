# Operating limits for this robot. Geometry and sensor poses come from model.sdf.
base_frame: base_link
max_linear_speed: 0.8
max_angular_speed: 0.6
linear_acceleration: 0.5
angular_acceleration: 0.8
reverse_speed: 0.15
footprint_padding: 0.05
command_timeout: 0.6
# Projection height relative to base_link, not to the Gazebo world.
scan_min_height: 0.15
scan_max_height: 1.8
scan_max_range: 30.0
scan_angle_increment: 0.00872664626

# Simulation covariance floors; calibrate from the physical robot before hardware use.
localization:
  wheel_linear_stddev: 0.05
  wheel_lateral_stddev: 0.05
  wheel_angular_stddev: 0.1
  imu_angular_stddev: 0.02
  gnss_position_stddev: 0.15
