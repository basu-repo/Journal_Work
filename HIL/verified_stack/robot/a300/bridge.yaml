# A300 Gazebo -> ROS 2 bridge configuration (ros_gz_bridge YAML list).
# Source of topic names: robot/a300/model.sdf.
# Use ONE robot bridge at a time; both files intentionally expose common ROS topics.
# From the Work directory, after starting the corresponding simulation:
#   source /opt/ros/jazzy/setup.bash
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:="$PWD/robot/a300/bridge.yaml"
#
# RGB images are not bridged. Frames are preserved, not renamed or transformed.
# These entries connect existing sensors; they do not create a complete Nav2 TF tree,
# SLAM, localization, filtered scans, or navigation. Do not fuse unavailable IMU orientation.
# Contact messages are event-driven: no chassis contact can mean no chassis messages.
# Simulation truth is deliberately excluded from navigation inputs.
# Topics are independent of the selected terrain/world name.
# Format reference: https://github.com/gazebosim/ros_gz/blob/jazzy/ros_gz_bridge/README.md

# Simulation time; set use_sim_time:=true on ROS navigation nodes.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK
  lazy: false

# ROS autonomous command input. Manual driving still uses native Gazebo Teleop.
# Twist (not TwistStamped); configure the eventual Nav2 output accordingly.
- ros_topic_name: /cmd_vel
  gz_topic_name: /cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
  lazy: false

# Wheel odometry (not Gazebo ground truth).
- ros_topic_name: /odom
  gz_topic_name: /wheel/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  lazy: false

# Wheel odom -> base_link TF only. Disable this entry if an EKF owns that transform.
# Sensor/link TF and map -> odom must be supplied by the later robot/localization setup.
- ros_topic_name: /tf
  gz_topic_name: /wheel/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS
  lazy: false

# 3D LiDAR cloud. Build a ground-filtered 2D /scan later if the selected Nav2 setup needs it.
# Raw Gazebo multi-row scan is /husky/lidar3d; it is not assumed to be a ready 2D navigation scan.
- ros_topic_name: /lidar/points
  gz_topic_name: /husky/lidar3d/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false

# imu_sensor; 50 Hz as configured in model.sdf.
- ros_topic_name: /imu/data
  gz_topic_name: /model/husky/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false

# navsat_sensor; 10 Hz as configured in model.sdf.
- ros_topic_name: /gps/fix
  gz_topic_name: /husky/gps
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: false

# camera_front depth only; lazy streams activate when a ROS subscriber connects.
- ros_topic_name: /depth/front/image
  gz_topic_name: /a300/sensors/camera_front/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true

