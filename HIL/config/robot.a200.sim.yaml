# Gazebo-only A200 HIL profile. It never addresses the physical drive topic.
base_frame: base_link
map_frame: map
odom_frame: odom_lidar
odom_topic: /fastlio/odometry_base
localization_mode: slam
use_sim_time: true
tf_source_topic: /tf
tf_topic: /hil/tf
tf_static_topic: /tf_static
# Keep false in the repository. Set true only in a temporary/site copy after a
# disarmed preflight has passed for the current checkout.
verified_profile_armed: false
localization:
  calibration_confirmed: true
  fastlio_config: fastlio.a200.simulation.yaml
  pointcloud_topic: /lidar/points
  imu_topic: /imu/data
  raw_odom_topic: /fastlio/odometry
  source_frame: camera_init
  source_body_frame: body
  # FAST-LIO body is the simulated IMU. This is IMU/body -> base_link.
  body_to_base_translation: [-0.23, -0.01, -0.23]
  body_to_base_quaternion: [0.0, 0.0, 0.0, 1.0]
  min_height: 0.15
  max_height: 1.8
  range_min: 0.8
  range_max: 30.0
  scan_angle_increment: 0.00872664626
  scan_period: 0.1
  sensor_timeout: 1.0
  map_timeout: 10.0
  tf_timeout: 0.5
  stable_seconds: 2.0
footprint:
  - [-0.55, -0.36]
  - [0.55, -0.36]
  - [0.55, 0.36]
  - [-0.55, 0.36]
footprint_padding: 0.05
max_linear_speed: 0.20
max_angular_speed: 0.25
linear_acceleration: 0.20
angular_acceleration: 0.30
reverse_speed: 0.10
command_timeout: 0.60
scan_topic: /scan
map_topic: /map
planner_command_topic: /hil/planner_cmd_vel
hardware_command_topic: /sim/husky/cmd_vel
